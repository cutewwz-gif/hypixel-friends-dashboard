<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hypixel 好友详情与在线热力图">
    <title>好友详情 · Hypixel Friends</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-friend-detail">
    <div class="stars-layer" id="starsLayer" aria-hidden="true"></div>
    <div class="gradient-overlay" aria-hidden="true"></div>

    <div class="container">
        <header class="site-header">
            <div class="logo">
                <span class="logo-icon">👤</span>
                <span class="logo-text">Friend Detail</span>
            </div>
            <nav class="header-nav">
                <a href="index.html" class="nav-link">Dashboard</a>
                <a href="friends.html" class="nav-link">好友列表</a>
            </nav>
            <div class="header-meta">
                <span class="cache-badge" id="cacheBadge" hidden></span>
                <button class="refresh-btn" id="refreshBtn" title="刷新数据">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6"/>
                        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                    </svg>
                    刷新
                </button>
            </div>
        </header>

        <div class="loading-state" id="loadingState">
            <div class="loader"></div>
            <p>正在加载好友详情...</p>
        </div>

        <div class="error-state" id="errorState" hidden>
            <div class="error-icon">⚠</div>
            <h2>数据加载失败</h2>
            <p id="errorMessage">请稍后重试</p>
            <p class="error-hint" id="errorHint" hidden></p>
            <a href="friends.html" class="retry-btn">返回好友列表</a>
        </div>

        <main class="friend-detail page-content" id="friendDetail" hidden>
            <a href="friends.html" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                返回好友列表
            </a>

            <section class="player-card glass-card">
                <div class="player-card-inner">
                    <div class="player-skin">
                        <div class="skin-glow"></div>
                        <img id="playerSkin" src="" alt="玩家皮肤" class="skin-image">
                        <div class="online-badge" id="onlineBadge"></div>
                    </div>
                    <div class="player-info">
                        <h1 class="player-name" id="playerName">—</h1>
                        <div class="player-rank" id="playerRank">—</div>
                        <div class="player-game" id="playerGame" hidden></div>
                        <div class="player-meta-grid friend-meta-grid">
                            <div class="meta-item">
                                <span class="meta-label">Network Level</span>
                                <span class="meta-value highlight" id="networkLevel">—</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">BedWars Star</span>
                                <span class="meta-value highlight" id="bedwarsStar">—</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">FKDR</span>
                                <span class="meta-value highlight" id="fkdr">—</span>
                            </div>
                        </div>
                        <p class="update-time" id="updateTime"></p>
                    </div>
                </div>
            </section>

            <section class="heatmap-section glass-card">
                <h2 class="section-title">
                    <span class="title-icon">📅</span>
                    在线历史热力图
                    <span class="section-hint">最近 30 天 · 每小时检测记录</span>
                </h2>
                <p class="heatmap-note">在线数据由服务器定时检测记录（Hypixel API 不提供历史在线数据）</p>

                <div class="heatmap-legend">
                    <span>少</span>
                    <span class="heatmap-legend-cell level-0"></span>
                    <span class="heatmap-legend-cell level-1"></span>
                    <span class="heatmap-legend-cell level-2"></span>
                    <span class="heatmap-legend-cell level-3"></span>
                    <span class="heatmap-legend-cell level-4"></span>
                    <span>多</span>
                </div>

                <div class="heatmap-wrap" id="heatmapWrap">
                    <div class="heatmap-scroll">
                        <div class="heatmap-grid" id="heatmapGrid"></div>
                    </div>
                </div>

                <div class="heatmap-tooltip" id="heatmapTooltip" hidden></div>
            </section>

            <section class="analytics-section glass-card">
                <h2 class="section-title">
                    <span class="title-icon">📈</span>
                    活跃分析
                    <span class="section-hint">最近 30 天自动计算</span>
                </h2>
                <div class="analytics-grid">
                    <div class="analytics-card">
                        <div class="analytics-label">最常上线时间</div>
                        <div class="analytics-value" id="mostActiveTime">—</div>
                    </div>
                    <div class="analytics-card">
                        <div class="analytics-label">最活跃星期</div>
                        <div class="analytics-value" id="mostActiveWeekday">—</div>
                    </div>
                    <div class="analytics-card">
                        <div class="analytics-label">平均每天在线时长</div>
                        <div class="analytics-value" id="avgDailyOnline">—</div>
                    </div>
                    <div class="analytics-card">
                        <div class="analytics-label">最近一次上线</div>
                        <div class="analytics-value" id="lastOnline">—</div>
                    </div>
                    <div class="analytics-card">
                        <div class="analytics-label">最近一次离线</div>
                        <div class="analytics-value" id="lastOffline">—</div>
                    </div>
                    <div class="analytics-card">
                        <div class="analytics-label">活跃天数</div>
                        <div class="analytics-value" id="activeDays">—</div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <p>数据来源 <a href="https://hypixel.net" target="_blank" rel="noopener">Hypixel API</a> · 每 60 秒自动刷新</p>
        </footer>
    </div>

    <script src="friend.js"></script>
</body>
</html>
